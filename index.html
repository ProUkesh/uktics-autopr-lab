<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uktics AutoFix Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        nav a {
            color: #ffffff;
            margin: 0 15px;
            text-decoration: none;
        }
        .hero {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
        }
        .button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            background-color: #6200ea;
            color: white;
            cursor: pointer;
        }
        .features {
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }
        .feature-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            width: 30%;
            text-align: center;
        }
        .steps {
            padding: 20px;
            text-align: center;
        }
        footer {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Uktics</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#autofix">AutoFix</a>
            <a href="#runs">Runs</a>
            <button class="button" onclick="openModal()">Connect GitHub</button>
        </nav>
    </header>
    <section class="hero">
        <h1>AI Dev Agent for AutoFix PRs</h1>
        <p>Your intelligent assistant for managing pull requests.</p>
        <button class="button">Start AutoFix</button>
        <button class="button">View Runs</button>
    </section>
    <section class="features">
        <div class="feature-card">
            <h2>Plan → Code → Review</h2>
        </div>
        <div class="feature-card">
            <h2>CI Watch + Auto-merge</h2>
        </div>
        <div class="feature-card">
            <h2>Run History + Patches</h2>
        </div>
    </section>
    <section class="steps">
        <h2>How it works</h2>
        <p>1. Step one: 🚀</p>
        <p>2. Step two: 🔍</p>
        <p>3. Step three: ⚙️</p>
        <p>4. Step four: ✅</p>
    </section>
    <footer>
        <p>Demo UI for uktics-autopr-lab</p>
    </footer>
    <script>
        function openModal() {
            alert('This is a UI-only demo.');
        }
    </script>
</body>
</html>
