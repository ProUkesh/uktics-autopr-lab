<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(94, 234, 212, 0.16), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(129, 140, 248, 0.14), transparent 30rem),
        #0f1115;
    }

    header {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.045);
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    nav a:hover,
    nav a[aria-current="page"] {
      color: #ffffff;
      border-color: rgba(94, 234, 212, 0.45);
      background: rgba(94, 234, 212, 0.12);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 80px 0 96px;
    }

    .hero {
      max-width: 760px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      border: 1px solid rgba(94, 234, 212, 0.32);
      border-radius: 999px;
      padding: 8px 12px;
      color: #99f6e4;
      background: rgba(94, 234, 212, 0.08);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 86px);
      line-height: 0.94;
      letter-spacing: -0.075em;
    }

    p {
      margin: 22px 0 0;
      color: #cbd5e1;
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.65;
    }

    .card {
      margin-top: 34px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
    }

    .card strong {
      color: #ffffff;
    }

    @media (max-width: 720px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      nav {
        justify-content: flex-start;
      }

      main {
        padding-top: 48px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Uktics Demo</div>
    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="login.html" aria-current="page">Login</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">Generated by Uktics</div>
      <h1>Login</h1>
      <p>This page was generated from your command and is ready to customize.</p>

      <div class="card">
        <strong>Original command:</strong>
        <p>we need to add login.html and also link that in navigation bar.</p>
      </div>
    </section>
  </main>
</body>
</html>
